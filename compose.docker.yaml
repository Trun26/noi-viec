name: mobi-doc-lap
services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MAT_KHAU_SQL:?Chay tai-lieu/khoi-dong-docker.ps1 de tao cau hinh}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - du-lieu-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    image: mobi-may-chu:local
    build:
      context: ./may-chu
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TrinhDien: "true"
      ConnectionStrings__DuLieu: Server=sql-server;Database=mobi;User Id=sa;Password=${MAT_KHAU_SQL};Encrypt=True;TrustServerCertificate=True
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - tep-tai-len:/app/kho-tep
    depends_on:
      sql-server:
        condition: service_healthy
    restart: unless-stopped
volumes:
  du-lieu-sql:
  tep-tai-len:
